[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investing-plz"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyJWT>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: calls an external public API and is opt-in"]
